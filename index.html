<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Coq se Loge — Studios étudiants par ville et par école</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #FAF7F2; color: #2B211B; }
    #leafletMap { z-index: 10; background-color: #EFE8DE; width: 100%; height: 450px; min-height: 450px; }
    .coq-price-pin { background: #BF5F22; color: #FFFFFF; font-weight: 800; font-size: 12px; padding: 4px 8px; border-radius: 999px; border: 2px solid #FFFDF9; box-shadow: 0 4px 12px rgba(43, 33, 27, 0.22); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .coq-price-pin:hover { background: #8C3B1C; color: #FFFDF9; border-color: #F4BE6E; transform: scale(1.14); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-[#B8552E] text-[#FFFDF9] border-b border-[#9D4421]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-[#9E4320] flex items-center justify-center font-black text-white text-lg">🐓</div>
        <span class="text-base sm:text-lg font-black tracking-tight text-[#FFFDF9]">Le Coq <span class="text-[#FDE0B2]">se Loge</span></span>
      </div>
    </div>
  </header>

  <!-- FILTRES -->
  <section class="bg-[#B8552E] text-[#FFFDF9] py-4 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <h1 class="text-xl sm:text-2xl font-black">Studios à</h1>
        <select id="citySelect" onchange="handleCityChange(this.value)" class="bg-[#9E4320] text-[#FDE0B2] font-black text-xl rounded-xl px-3 py-1 border border-[#DC815B] cursor-pointer focus:outline-none">
          <option value="Belfort">Belfort</option>
          <option value="Rennes">Rennes</option>
          <option value="Lyon">Lyon</option>
        </select>
      </div>
      <div class="bg-white text-[#2B211B] p-3 rounded-2xl flex items-center gap-4 shadow-sm">
        <span class="text-xs font-extrabold uppercase">Budget max :</span>
        <input id="budgetSlider" type="range" min="250" max="850" step="10" value="600" oninput="handleBudgetChange(this.value)" class="cursor-pointer" />
        <span id="budgetDisplay" class="text-xs font-black text-[#A84823]">600 € / mois</span>
      </div>
    </div>
  </section>

  <!-- CONTENU PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <!-- Liste des offres -->
      <div class="lg:col-span-6 space-y-4">
        <h2 class="text-lg font-black text-[#2B211B]"><span id="resultsCount">0</span> offres disponibles</h2>
        <div id="studiosGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </div>
      <!-- Carte interactive Leaflet -->
      <div class="lg:col-span-6 lg:sticky lg:top-20">
        <div class="bg-white rounded-3xl p-4 shadow-sm border border-[#EBDED1]">
          <h3 id="mapSchoolTitle" class="text-sm font-black text-[#2B211B] mb-2">Plan interactif des résidences</h3>
          <div id="leafletMap" class="rounded-2xl border border-[#E3D3C3]"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const CITIES_DATA = {
      Belfort: { lat: 47.6405, lng: 6.8580, offers: [
        { id: "b1", title: "Résidence CROUS — Campus Belfort", type: "CROUS", lat: 47.6423, lng: 6.8442, surface: 18, price: 320 },
        { id: "b2", title: "Studio Particulier — Centre-ville", type: "Particulier", lat: 47.6402, lng: 6.8590, surface: 22, price: 410 },
        { id: "b3", title: "Résidence Privée Techn'hom", type: "Résidence", lat: 47.6415, lng: 6.8510, surface: 20, price: 380 }
      ]},
      Rennes: { lat: 48.1147, lng: -1.6794, offers: [
        { id: "r1", title: "Résidence CROUS — Beaulieu", type: "CROUS", lat: 48.1195, lng: -1.6365, surface: 18, price: 340 },
        { id: "r2", title: "Studio Centre — République", type: "Particulier", lat: 48.1110, lng: -1.6780, surface: 23, price: 490 },
        { id: "r3", title: "Résidence Privée Villejean", type: "Résidence", lat: 48.1180, lng: -1.7000, surface: 20, price: 450 }
      ]},
      Lyon: { lat: 45.7578, lng: 4.8320, offers: [
        { id: "l1", title: "Résidence CROUS — La Doua", type: "CROUS", lat: 45.7824, lng: 4.8705, surface: 19, price: 360 },
        { id: "l2", title: "Studio Particulier — Part-Dieu", type: "Particulier", lat: 45.7600, lng: 4.8580, surface: 21, price: 580 },
        { id: "l3", title: "Résidence Privée Berges du Rhône", type: "Résidence", lat: 45.7508, lng: 4.8371, surface: 22, price: 610 }
      ]}
    };

    let state = { city: "Belfort", maxBudget: 700 };
    let mapInstance = null;
    let markersLayer = null;

    function initApp() {
      applyFilters();
      setTimeout(initMap, 150);
    }

    function initMap() {
      if (mapInstance) return;
      const cityData = CITIES_DATA[state.city];
      mapInstance = L.map("leafletMap", { zoomControl: true }).setView([cityData.lat, cityData.lng], 14);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(mapInstance);
      markersLayer = L.layerGroup().addTo(mapInstance);
      updateMapMarkers();
    }

    function handleCityChange(city) {
      state.city = city;
      const cityData = CITIES_DATA[city];
      if (mapInstance) {
        mapInstance.setView([cityData.lat, cityData.lng], 14);
        setTimeout(() => mapInstance.invalidateSize(), 100);
      }
      applyFilters();
    }

    function handleBudgetChange(val) {
      state.maxBudget = parseInt(val, 10);
      document.getElementById("budgetDisplay").textContent = `${state.maxBudget} € / mois`;
      applyFilters();
    }

    function applyFilters() {
      const cityData = CITIES_DATA[state.city];
      const filtered = cityData.offers.filter(o => o.price <= state.maxBudget);
      document.getElementById("resultsCount").textContent = filtered.length;

      const grid = document.getElementById("studiosGrid");
      grid.innerHTML = filtered.map(o => `
        <div class="bg-white p-4 rounded-2xl border border-[#EBDED1] shadow-sm flex flex-col justify-between gap-3">
          <div>
            <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-[#FDF1EA] text-[#B8552E]">${o.type}</span>
            <h4 class="font-black text-sm mt-1.5">${o.title}</h4>
            <p class="text-xs text-gray-500 mt-0.5">${o.surface} m²</p>
          </div>
          <div class="flex items-center justify-between pt-2 border-t border-gray-100">
            <span class="font-black text-base text-[#B8552E]">${o.price} € <span class="text-xs text-gray-500 font-normal">/mois</span></span>
            <button onclick="focusOnOffer(${o.lat}, ${o.lng})" class="px-3 py-1.5 bg-[#B8552E] text-white text-xs font-bold rounded-xl cursor-pointer">Voir sur la carte</button>
          </div>
        </div>
      `).join("");

      if (markersLayer) updateMapMarkers(filtered);
    }

    function updateMapMarkers(offers = CITIES_DATA[state.city].offers.filter(o => o.price <= state.maxBudget)) {
      markersLayer.clearLayers();
      offers.forEach(o => {
        const marker = L.marker([o.lat, o.lng], {
          icon: L.divIcon({ className: "", html: `<div class="coq-price-pin">${o.price} €</div>`, iconSize: [58, 24], iconAnchor: [29, 12] })
        }).addTo(markersLayer);
      });
      setTimeout(() => mapInstance.invalidateSize(), 50);
    }

    function focusOnOffer(lat, lng) {
      if (mapInstance) {
        mapInstance.setView([lat, lng], 16);
        setTimeout(() => mapInstance.invalidateSize(), 50);
      }
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
